name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0' }
      - name: Restore signing key (optional secrets)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No RELEASE_KEYSTORE_B64 secret - signing with a temporary debug key."
          fi
      - name: Build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs "$APK" | head -20
          $BT/aapt2 dump badging "$APK" | grep -E "sdkVersion|targetSdkVersion|package:|uses-permission"
          $BT/zipalign -c -P 16 -v 4 "$APK" | tail -1
          cp "$APK" OCRScanner.apk
      - uses: actions/upload-artifact@v4
        with: { name: OCRScanner-apk, path: OCRScanner.apk }
      - name: Publish as "latest" release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OCRScanner.apk --title "OCR Scanner (latest build)" \
            --notes "Fully offline OCR scanner for Android 7–17. Download OCRScanner.apk on your phone and open it to install."
      - name: Also keep a copy on the apk branch
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout --orphan apk && git rm -rfq --cached . && git add -f OCRScanner.apk
          git commit -qm "APK build ${{ github.sha }}" && git push -f origin apk
