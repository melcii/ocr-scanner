name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk OCRScanner.apk
      - uses: actions/upload-artifact@v4
        with: { name: OCRScanner-apk, path: OCRScanner.apk }
      - name: Publish as "latest" release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OCRScanner.apk --title "OCR Scanner (latest build)" \
            --notes "Fully offline OCR scanner. Download OCRScanner.apk on your phone and open it to install."
      - name: Also keep a copy on the apk branch
        run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git checkout --orphan apk && git rm -rfq --cached . && git add -f OCRScanner.apk
          git commit -qm "APK build ${{ github.sha }}" && git push -f origin apk
