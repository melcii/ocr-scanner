<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>OCR Scanner</title>
<style>
  :root {
    --bg: #0f1115; --surface: #181b22; --surface-2: #20242d; --line: #2a2f3a;
    --text: #eef1f6; --muted: #8b93a3; --accent: #6ea8ff; --accent-ink: #0b1a33;
    --ok: #4cd6a0; --danger: #ff7b7b; --radius: 20px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f8; --surface: #ffffff; --surface-2: #eef0f4; --line: #e1e4ea;
            --text: #14171c; --muted: #677083; --accent: #2f6fe4; --accent-ink: #ffffff; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap: 14px; }

  header { display: flex; align-items: center; gap: 10px; padding: 4px 2px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -.2px; }
  .badge { margin-left: auto; font-size: 12px; color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent);
    padding: 4px 10px; border-radius: 999px; display: flex; gap: 6px; align-items: center; }

  .chips { display: flex; gap: 8px; }
  .chip { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    padding: 10px 6px; border-radius: 12px; font-size: 14px; font-weight: 500; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    min-height: 220px; flex: 0 0 auto; overflow: hidden; display: grid; place-items: center; }
  .stage img { display: block; max-width: 100%; max-height: 42vh; object-fit: contain; }
  .empty { text-align: center; color: var(--muted); padding: 30px 20px; }
  .empty svg { opacity: .6; margin-bottom: 8px; }
  .stage .tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
  .iconbtn { width: 40px; height: 40px; border-radius: 12px; border: none; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; }

  .progress { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px; background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; font-size: 13px; }
  .bar { height: 4px; background: rgba(255,255,255,.25); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 16px;
    padding: 15px; font-size: 16px; font-weight: 600; background: var(--surface-2); color: var(--text); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn:active, .chip:active, .iconbtn:active { transform: scale(.97); }

  .result { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 180px; flex: 1; }
  .result-head { display: flex; align-items: center; padding: 12px 14px 0; gap: 8px; color: var(--muted); font-size: 13px; }
  .result-head .spacer { flex: 1; }
  .small { border: none; background: var(--surface-2); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; display: flex; gap: 6px; align-items: center; }
  textarea { flex: 1; min-height: 140px; width: 100%; resize: none; border: none; outline: none; background: transparent; color: var(--text);
    font: 15px/1.5 ui-monospace, "Roboto Mono", monospace; padding: 12px 14px 16px; }
  textarea::placeholder { color: var(--muted); }

  .camera { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; z-index: 10; }
  .camera.open { display: flex; }
  .camera video { flex: 1; width: 100%; object-fit: cover; min-height: 0; }
  .frame { position: absolute; inset: 14% 8% 26%; border: 2px solid rgba(255,255,255,.7); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
  .cam-bar { display: flex; align-items: center; justify-content: space-around; padding: 22px 0 max(26px, env(safe-area-inset-bottom)); background: #000; }
  .shutter { width: 74px; height: 74px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,.2); }
  .shutter:active { background: #fff; }
  .cam-side { width: 48px; height: 48px; border-radius: 50%; border: none; background: rgba(255,255,255,.12); color: #fff; display: grid; place-items: center; }

  .toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px); background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 10h8M8 14h5"/></svg>
    </div>
    <h1>OCR Scanner</h1>
    <span class="badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      On-device
    </span>
  </header>

  <div class="chips" role="group" aria-label="Language">
    <button class="chip" data-lang="eng" aria-pressed="true">English</button>
    <button class="chip" data-lang="tur" aria-pressed="false">Türkçe</button>
    <button class="chip" data-lang="eng+tur" aria-pressed="false">Both</button>
  </div>

  <section class="stage" id="stage">
    <div class="empty" id="empty">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.2"/><path d="M8 5l1.5-2h5L16 5"/></svg>
      <div>Take a photo or pick an image<br>to pull the text out of it.</div>
    </div>
    <img id="preview" alt="" hidden>
    <div class="tools" id="tools" hidden>
      <button class="iconbtn" id="rotate" aria-label="Rotate">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
    <div class="progress" id="progress" hidden><span id="pstatus">Reading text…</span><div class="bar"><i id="pbar"></i></div></div>
  </section>

  <div class="actions">
    <button class="btn primary" id="camBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M9 6l1.5-2h3L15 6"/></svg>
      Camera
    </button>
    <button class="btn" id="galBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
      Gallery
    </button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <section class="result">
    <div class="result-head">
      <span id="meta">Extracted text</span>
      <span class="spacer"></span>
      <button class="small" id="copyBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>Copy</button>
      <button class="small" id="shareBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>Share</button>
    </div>
    <textarea id="out" placeholder="Recognized text will appear here. You can edit it before copying." spellcheck="false"></textarea>
  </section>

  <div class="camera" id="camera">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"></div>
    <div class="cam-bar">
      <button class="cam-side" id="camClose" aria-label="Close">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <button class="shutter" id="shutter" aria-label="Capture"></button>
      <button class="cam-side" id="camTorch" aria-label="Flash">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="tesseract.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const MAX_SIDE = 2200;               // downscale huge photos: faster, same accuracy
  const bridge = window.AndroidBridge; // provided by the Android shell (absent in a desktop browser)

  // Pick the right engine build: SIMD where the WebView supports it, plain otherwise.
  const simd = WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]));
  const corePath = new URL('core/' + (simd ? 'tesseract-core-simd-lstm.wasm.js' : 'tesseract-core-lstm.wasm.js'), location.href).href;
  const base = new URL('.', location.href).href;

  let lang = 'eng', worker = null, workerLang = null, busy = false, current = null, rotation = 0, stream = null;

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function setProgress(label, p) {
    $('progress').hidden = false; $('pstatus').textContent = label;
    $('pbar').style.width = Math.round((p || 0) * 100) + '%';
  }

  async function getWorker() {
    if (worker && workerLang === lang) return worker;
    if (worker) { await worker.terminate(); worker = null; }
    setProgress('Loading language…', 0);
    worker = await Tesseract.createWorker(lang.split('+'), 1, {
      workerPath: base + 'worker.min.js',
      corePath,
      langPath: base + 'lang',
      gzip: true,
      cacheMethod: 'none',
      logger: (m) => {
        if (m.status === 'recognizing text') setProgress('Reading text…', m.progress);
        else if (m.status) setProgress(m.status.charAt(0).toUpperCase() + m.status.slice(1) + '…', m.progress);
      }
    });
    workerLang = lang;
    return worker;
  }

  // Draw the source (image/video) to a canvas, scaled down and rotated.
  function toCanvas(src, w, h, rot) {
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    const sw = Math.round(w * s), sh = Math.round(h * s);
    const c = document.createElement('canvas');
    const swap = rot % 180 !== 0;
    c.width = swap ? sh : sw; c.height = swap ? sw : sh;
    const g = c.getContext('2d');
    g.translate(c.width / 2, c.height / 2); g.rotate(rot * Math.PI / 180);
    g.drawImage(src, -sw / 2, -sh / 2, sw, sh);
    return c;
  }

  async function run() {
    if (!current || busy) return;
    busy = true;
    const canvas = toCanvas(current, current.naturalWidth || current.width, current.naturalHeight || current.height, rotation);
    $('preview').src = canvas.toDataURL('image/jpeg', 0.9);
    $('preview').hidden = false; $('empty').hidden = true; $('tools').hidden = false;
    $('out').value = ''; $('meta').textContent = 'Working…';
    const t0 = performance.now();
    try {
      const w = await getWorker();
      const { data } = await w.recognize(canvas);
      const text = (data.text || '').replace(/\n{3,}/g, '\n\n').trim();
      $('out').value = text;
      const words = text ? text.split(/\s+/).length : 0;
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      $('meta').textContent = words ? `${words} words · ${Math.round(data.confidence)}% · ${secs}s` : 'No text found — try a sharper, closer shot';
    } catch (e) {
      console.error(e);
      $('meta').textContent = 'Something went wrong: ' + (e && e.message || e);
    } finally {
      $('progress').hidden = true; busy = false;
    }
  }

  function loadImage(url) {
    const img = new Image();
    img.onload = () => { current = img; rotation = 0; run(); };
    img.onerror = () => toast('Could not open that image');
    img.src = url;
  }

  // Language chips
  document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => {
    if (busy) return;
    document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
    lang = b.dataset.lang;
    if (current) run();
  }));

  // Gallery
  $('galBtn').onclick = () => $('file').click();
  $('file').onchange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) loadImage(URL.createObjectURL(f));
    e.target.value = '';
  };

  $('rotate').onclick = () => { if (!busy) { rotation = (rotation + 90) % 360; run(); } };

  // Camera
  async function openCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } }
      });
      $('video').srcObject = stream;
      $('camera').classList.add('open');
      const track = stream.getVideoTracks()[0];
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      $('camTorch').hidden = !caps.torch;
      if (caps.focusMode && caps.focusMode.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
    } catch (e) {
      console.error(e);
      toast('Camera unavailable — use Gallery instead');
    }
  }
  function closeCamera() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null; torchOn = false;
    $('camera').classList.remove('open');
  }
  let torchOn = false;
  $('camBtn').onclick = openCamera;
  $('camClose').onclick = closeCamera;
  $('camTorch').onclick = () => {
    const track = stream && stream.getVideoTracks()[0];
    if (!track) return;
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {});
  };
  $('shutter').onclick = () => {
    const v = $('video');
    if (!v.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    closeCamera();
    current = c; rotation = 0; run();
  };
  window.onBackPressed = () => {         // called by the Android shell
    if ($('camera').classList.contains('open')) { closeCamera(); return true; }
    return false;
  };

  // Copy / share
  $('copyBtn').onclick = async () => {
    const text = $('out').value;
    if (!text) return toast('Nothing to copy yet');
    if (bridge) { bridge.copy(text); return toast('Copied'); }
    try { await navigator.clipboard.writeText(text); toast('Copied'); } catch { $('out').select(); document.execCommand('copy'); toast('Copied'); }
  };
  $('shareBtn').onclick = () => {
    const text = $('out').value;
    if (!text) return toast('Nothing to share yet');
    if (bridge) bridge.share(text);
    else if (navigator.share) navigator.share({ text }).catch(() => {});
    else toast('Sharing not supported here');
  };
})();
</script>
</body>
</html>
