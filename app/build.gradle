plugins { id 'com.android.application' }

def ksFile = System.getenv('RELEASE_KEYSTORE_FILE')
def ksPass = System.getenv('RELEASE_KEYSTORE_PASSWORD')
def hasReleaseKey = ksFile && ksPass && file(ksFile).exists()

android {
    namespace 'org.localocr.scanner'
    compileSdk 37

    defaultConfig {
        applicationId 'org.localocr.scanner'
        minSdk 24
        targetSdk 37
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: 'ocrscanner'
                keyPassword ksPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true          // R8: strip unused code
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources { excludes += ['META-INF/**.version', 'META-INF/version-control-info.textproto'] }
    }

    dependenciesInfo {          // don't embed an encrypted dependency blob in the APK
        includeInApk = false
        includeInBundle = false
    }
}
